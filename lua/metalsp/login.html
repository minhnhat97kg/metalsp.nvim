<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Provider - MetaLSP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #1e1b4b, #09090b);
      --card-bg: rgba(15, 23, 42, 0.45);
      --card-border: rgba(99, 102, 241, 0.15);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 520px;
      padding: 20px;
      animation: fadeIn 0.8s ease-out;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    .logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .logo-badge {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 20px;
      padding: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.1);
    }

    .logo-badge svg {
      width: 36px;
      height: 36px;
      fill: var(--primary);
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #f8fafc 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      text-align: center;
      font-size: 15px;
      margin-bottom: 32px;
    }

    .step-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 32px;
    }

    .step-item {
      display: flex;
      gap: 16px;
    }

    .step-number {
      width: 28px;
      height: 28px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
      flex-shrink: 0;
    }

    .step-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .step-title {
      font-weight: 500;
      font-size: 16px;
      color: var(--text-main);
    }

    .step-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .btn-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      margin-top: 6px;
      transition: all 0.2s ease;
      width: fit-content;
    }

    .btn-link:hover {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
      transform: translateY(-1px);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
    }

    label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
    }

    input[type="password"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 15px;
      transition: all 0.2s ease;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
      background: rgba(0, 0, 0, 0.3);
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo-container">
        <div class="logo-badge">
          <!-- Main Icon -->
          <svg viewBox="0 0 24 24" id="provider-icon" width="36" height="36" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
          </svg>
        </div>
      </div>
      <h1 id="title-text">Connect API Key</h1>
      <p class="subtitle" id="subtitle-text">Set up credentials for MetaLSP</p>

      <div class="step-list">
        <div class="step-item">
          <div class="step-number">1</div>
          <div class="step-content">
            <div class="step-title">Generate API Key</div>
            <div class="step-desc" id="step1-desc">Open the provider dashboard to copy your personal API key.</div>
            <a href="#" target="_blank" class="btn-link" id="link-btn">
              Open Dashboard
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="7" y1="17" x2="17" y2="7"></line>
                <polyline points="7 7 17 7 17 17"></polyline>
              </svg>
            </a>
          </div>
        </div>

        <div class="step-item">
          <div class="step-number">2</div>
          <div class="step-content">
            <div class="step-title">Paste Key & Connect</div>
            <div class="step-desc">Enter the copied API key below to link it to Neovim.</div>
          </div>
        </div>
      </div>

      <form id="login-form">
        <div class="input-group">
          <label for="api-key">API Key</label>
          <input type="password" id="api-key" placeholder="Paste your key here..." required autocomplete="off">
        </div>
        <button type="submit" class="btn-submit" id="submit-btn">
          Connect to Neovim
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <script>
    // Get query params
    const params = new URLSearchParams(window.location.search);
    const port = params.get('port') || '19876';
    const provider = params.get('provider') || 'openai';

    const providerNames = {
      openai: 'OpenAI',
      gemini: 'Google Gemini'
    };

    const providerUrls = {
      openai: 'https://platform.openai.com/api-keys',
      gemini: 'https://aistudio.google.com/app/apikey'
    };

    // Update UI elements based on provider
    const name = providerNames[provider] || 'Provider';
    document.getElementById('title-text').innerText = 'Connect ' + name;
    document.getElementById('subtitle-text').innerText = 'Authenticate ' + name + ' with MetaLSP';
    document.getElementById('step1-desc').innerText = 'Open the ' + name + ' developer dashboard to create or copy your API Key.';
    document.getElementById('link-btn').href = providerUrls[provider] || '#';

    // Handle form submit
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const key = document.getElementById('api-key').value.trim();
      if (!key) return;

      // Disable button
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Connecting...';

      // Redirect to Neovim local server callback
      window.location.href = 'http://127.0.0.1:' + port + '/callback?key=' + encodeURIComponent(key);
    });
  </script>
</body>
</html>
